name: Build Flutter site

on:
  push:
    paths: ["site/**", ".github/workflows/flutter-site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/flutter-site.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: site-web-build
          path: site/build/web
