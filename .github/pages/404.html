<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Raf</title>
  <script>
    // Old blog URLs lived at the site root; they now live under /blog/.
    (function () {
      var p = location.pathname;
      if (/^\/(\d{4}\/|archive|about|page\d+|public\/|atom\.xml)/.test(p)) {
        location.replace('/blog' + p + location.search + location.hash);
      }
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #0E1116; color: #E8EAED; font-family: system-ui, sans-serif; }
    a { color: #FF7A2F; }
    main { padding: 16px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p><a href="/">Go to the home page</a> or <a href="/blog/">read the blog</a>.</p>
  </main>
</body>
</html>
